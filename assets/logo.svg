<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <!-- Outer rounded tile with ~11% margin for clean framing on light & dark themes -->
  <rect x="14" y="14" width="100" height="100" rx="22" fill="#0F172A" stroke="#38BDF8" stroke-width="5"/>
  <!-- Top terminal header dots -->
  <circle cx="32" cy="32" r="3.5" fill="#F87171"/>
  <circle cx="44" cy="32" r="3.5" fill="#FBBF24"/>
  <circle cx="56" cy="32" r="3.5" fill="#4ADE80"/>
  <line x1="22" y1="43" x2="106" y2="43" stroke="#1E293B" stroke-width="3"/>
  <!-- Terminal prompt chevron -->
  <path d="M29 58L41 67L29 76" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="47" y1="76" x2="61" y2="76" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
  <!-- UART digital logic square wave -->
  <path d="M28 95H44V83H58V95H70V83H88V95H100" stroke="#4ADE80" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Live RX indicator pulse top-right -->
  <circle cx="96" cy="32" r="4.5" fill="#4ADE80"/>
</svg>
